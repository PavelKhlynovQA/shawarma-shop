name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API-тесты (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Прогон API-тестов
        run: npm test

  e2e-tests:
    name: E2E-тесты (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка браузеров Playwright
        run: npx playwright install --with-deps chromium

      - name: Прогон E2E
        run: npx playwright test
        env:
          CI: "true"

      - name: Генерация Allure-отчёта
        if: always()
        run: npx allure generate allure-results -o allure-report --clean

      - name: HTML-отчёт Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Allure-отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Трейсы и скриншоты падений
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  visual-tests:
    name: Визуальные тесты
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка браузеров Playwright
        run: npx playwright install chromium

      - name: Прогон визуальных тестов
        run: npx playwright test --config=playwright.visual.config.js
        env:
          CI: "true"

      - name: Отчёт и диффы
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report-visual/
            test-results/
          retention-days: 7

  docker-build:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shawarma-shop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка, что образ стартует
        run: |
          docker run -d --name smoke -p 3000:3000 -e PORT=3000 shawarma-shop:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then echo "OK"; exit 0; fi
            sleep 2
          done
          echo "Контейнер не поднялся"; docker logs smoke; exit 1

      - name: Логи контейнера
        if: failure()
        run: docker logs smoke

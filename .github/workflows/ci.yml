name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API-тесты (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Прогон API-тестов
        run: npm test

  e2e-tests:
    name: E2E-тесты (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка браузеров Playwright
        run: npx playwright install --with-deps chromium

      - name: Прогон E2E
        run: npx playwright test
        env:
          CI: "true"

      - name: Генерация Allure-отчёта
        if: always()
        run: npx allure generate allure-results -o allure-report --clean

      - name: HTML-отчёт Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Allure-отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Трейсы и скриншоты падений
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  visual-tests:
    name: Визуальные тесты
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка браузеров Playwright
        run: npx playwright install chromium

      - name: Прогон визуальных тестов
        run: npx playwright test --config=playwright.visual.config.js
        env:
          CI: "true"

      - name: Отчёт и диффы
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            playwright-report-visual/
            test-results/
          retention-days: 7

  java-smoke:
    name: Java-тесты (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей приложения
        run: npm ci

      - name: Запуск приложения
        run: |
          npm start &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done

      - name: Прогон Java smoke-набора
        run: mvn -B -f java-tests/pom.xml test -Dtest=CartApiTest,OrdersApiTest

      - name: Отчёт Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: java-tests/target/surefire-reports/
          retention-days: 7

  java-full:
    name: Java-тесты (полный набор, ночной)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей приложения
        run: npm ci

      - name: Запуск приложения
        run: |
          npm start &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done

      - name: Полный прогон Java-тестов
        run: mvn -B -f java-tests/pom.xml test

      - name: Отчёт Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-full
          path: java-tests/target/surefire-reports/
          retention-days: 14

  load-smoke:
    name: Нагрузочный прогон (ночной)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка JMeter
        run: |
          curl -sSL -o jmeter.zip https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q jmeter.zip

      - name: Установка зависимостей приложения
        run: npm ci

      - name: Запуск приложения
        run: |
          npm start &
          for i in $(seq 1 40); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done

      - name: Нагрузочный прогон (60 секунд)
        run: ./apache-jmeter-5.6.3/bin/jmeter -n -t load/plan.jmx -l load/results.jtl -j load/jmeter.log

      - name: Метрики прогона
        if: always()
        run: node load/parse.mjs

      - name: Артефакты прогона
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: |
            load/results.jtl
            load/metrics.json
            load/jmeter.log
          retention-days: 14
  docker-build:
    name: Сборка Docker-образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: shawarma-shop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка, что образ стартует
        run: |
          docker run -d --name smoke -p 3000:3000 -e PORT=3000 shawarma-shop:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then echo "OK"; exit 0; fi
            sleep 2
          done
          echo "Контейнер не поднялся"; docker logs smoke; exit 1

      - name: Логи контейнера
        if: failure()
        run: docker logs smoke

services:
  db:
    image: postgres:16-alpine
    container_name: shawarma-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shawarma
      POSTGRES_USER: shawarma
      POSTGRES_PASSWORD: shawarma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shawarma -d shawarma"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: shawarma-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://shawarma:shawarma@db:5432/shawarma
      JWT_SECRET: change-me-in-production
    ports:
      - "3000:3000"

volumes:
  pgdata:
